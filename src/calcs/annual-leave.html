<form id="calcForm" autocomplete="off">
<div class="row">
  <div class="fld"><label for="start">입사일</label><div class="in"><input id="start" type="date" value="2023-03-02"></div></div>
  <div class="fld"><label for="base">기준일</label><div class="in"><input id="base" type="date"></div>
    <div class="hint">비워 두면 오늘 날짜로 계산합니다.</div></div>
  <div class="fld"><label for="wage">시급 (통상임금)</label><div class="in"><input id="wage" inputmode="numeric" data-money value="12,000"><span class="u">원</span></div>
    <div class="hint">월급제는 월 통상임금 ÷ 209로 구합니다.</div></div>
  <div class="fld"><label for="hrs">1일 소정근로시간</label><div class="in"><input id="hrs" inputmode="decimal" value="8"><span class="u">시간</span></div></div>
  <div class="fld"><label for="unused">못 쓴 연차 일수</label><div class="in"><input id="unused" inputmode="decimal" value="5"><span class="u">일</span></div></div>
</div>
<div class="btns"><button class="btn" type="submit">연차 계산하기</button><button class="btn ghost" type="reset" data-reset>초기화</button></div>
</form>
<div class="result" id="res"></div>
