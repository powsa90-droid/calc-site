<form id="calcForm" autocomplete="off">
<div class="row">
  <div class="fld" style="grid-column:1/-1"><label>계산 방식</label>
    <div class="seg"><label><input type="radio" name="mode" value="diff" checked><span>두 날짜 사이 일수</span></label><label><input type="radio" name="mode" value="add"><span>날짜 + N일</span></label></div></div>
  <div class="fld"><label for="d1">시작일</label><div class="in"><input id="d1" type="date"></div><div class="hint">비워 두면 오늘</div></div>
  <div class="fld" id="b2"><label for="d2">목표일</label><div class="in"><input id="d2" type="date" value="2027-01-01"></div></div>
  <div class="fld" id="b3" style="display:none"><label for="n">더할 일수</label><div class="in"><input id="n" inputmode="numeric" value="100"><span class="u">일</span></div></div>
  <div class="fld"><label>시작일 포함</label>
    <div class="seg"><label><input type="radio" name="inc" value="0" checked><span>포함 안 함 (D-day)</span></label><label><input type="radio" name="inc" value="1"><span>포함 (기념일)</span></label></div></div>
</div>
<div class="btns"><button class="btn" type="submit">계산하기</button><button class="btn ghost" type="reset" data-reset>초기화</button></div>
</form>
<div class="result" id="res"></div>
