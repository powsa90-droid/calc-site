<form id="calcForm" autocomplete="off">
<div class="row">
  <div class="fld"><label for="pay">퇴직금 (퇴직급여 총액)</label><div class="in"><input id="pay" inputmode="numeric" data-money value="50,000,000"><span class="u">원</span></div></div>
  <div class="fld"><label for="start">입사일</label><div class="in"><input id="start" type="date" value="2016-12-01"></div></div>
  <div class="fld"><label for="end">퇴사일 (마지막 근무일)</label><div class="in"><input id="end" type="date" value="2026-11-30"></div>
    <div class="hint">근속연수는 1년 미만 끝수를 1년으로 올립니다.</div></div>
</div>
<div class="btns"><button class="btn" type="submit">퇴직소득세 계산하기</button><button class="btn ghost" type="reset" data-reset>초기화</button></div>
</form>
<div class="result" id="res"></div>
