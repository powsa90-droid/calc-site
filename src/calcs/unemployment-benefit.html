<form id="calcForm" autocomplete="off">
<div class="row">
  <div class="fld"><label for="wage3">퇴직 전 3개월 급여 합계 (세전)</label><div class="in"><input id="wage3" inputmode="numeric" data-money value="9,000,000"><span class="u">원</span></div></div>
  <div class="fld"><label for="d3">3개월 일수</label><div class="in"><input id="d3" inputmode="numeric" value="92"><span class="u">일</span></div>
    <div class="hint">퇴직 전 3개월의 달력상 일수 (보통 89~92일)</div></div>
  <div class="fld"><label for="hrs">1일 소정근로시간</label><div class="in"><input id="hrs" inputmode="decimal" value="8"><span class="u">시간</span></div></div>
  <div class="fld"><label>퇴직 당시 나이</label>
    <div class="seg"><label><input type="radio" name="age" value="u50" checked><span>50세 미만</span></label><label><input type="radio" name="age" value="o50"><span>50세 이상·장애인</span></label></div></div>
  <div class="fld"><label for="ins">고용보험 가입기간</label><select id="ins">
    <option value="0">1년 미만</option><option value="1" selected>1년 이상 3년 미만</option><option value="2">3년 이상 5년 미만</option><option value="3">5년 이상 10년 미만</option><option value="4">10년 이상</option></select></div>
</div>
<div class="btns"><button class="btn" type="submit">실업급여 계산하기</button><button class="btn ghost" type="reset" data-reset>초기화</button></div>
</form>
<div class="result" id="res"></div>
