<form id="calcForm" autocomplete="off">
<div class="row">
  <div class="fld"><label for="start">입사일</label><div class="in"><input id="start" type="date" value="2022-03-02"></div></div>
  <div class="fld"><label for="last">마지막 근무일</label><div class="in"><input id="last" type="date" value="2026-11-30"></div>
    <div class="hint">퇴직일은 마지막 근무일의 다음 날로 자동 계산합니다.</div></div>
  <div class="fld"><label for="wage3">퇴직 전 3개월 급여 합계 (세전)</label><div class="in"><input id="wage3" inputmode="numeric" data-money value="10,500,000"><span class="u">원</span></div>
    <div class="hint">기본급과 매달 받은 수당을 모두 더한 금액입니다.</div></div>
  <div class="fld"><label for="bonus">최근 1년 상여금 합계</label><div class="in"><input id="bonus" inputmode="numeric" data-money value="0"><span class="u">원</span></div></div>
  <div class="fld"><label for="leave">전년도 미사용 연차수당</label><div class="in"><input id="leave" inputmode="numeric" data-money value="0"><span class="u">원</span></div></div>
  <div class="fld"><label for="ord">월 통상임금 (선택)</label><div class="in"><input id="ord" inputmode="numeric" data-money value=""><span class="u">원</span></div>
    <div class="hint">평균임금이 통상임금보다 적으면 통상임금으로 계산합니다. 주 40시간 기준으로 1일 통상임금을 구합니다.</div></div>
</div>
<div class="btns"><button class="btn" type="submit">퇴직금 계산하기</button><button class="btn ghost" type="reset" data-reset>초기화</button></div>
</form>
<div class="result" id="res"></div>
